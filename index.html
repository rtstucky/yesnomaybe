<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wichita Zoning Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div id="container">
        <div id="map"></div>
        
        <div id="sidebar">
            <div id="sidebar-header">
                <div class="title-box">
                    <h1>Can You Build Here?</h1>
                    <div class="title-box-btm"></div>
                </div>
                <p>Loading map data...</p>
            </div>
            <div id="sidebar-content">

                <!-- District Filter -->
                <div id="district-filter">
                    <div id="district-filter-label">Filter by District</div>
                    <div id="district-checkboxes">Loading districts...</div>
                </div>

                <div class="detail-row">
                    <div class="detail-label">Select Land Use</div>
                    <select id="use-select">
                        <option value="">Choose a use...</option>
                    </select>
                </div>

                <div id="bbox-toolbar">
                    <button id="draw-bbox-btn" class="bbox-btn">Draw Area</button>
                    <button id="clear-bbox-btn" class="bbox-btn">✕ Clear</button>
                </div>
                <div id="bbox-hint">Click and drag on the map to draw a selection rectangle.</div>

                <div id="bbox-stats-container">
                    <div class="selection-banner">Selected Area</div>
                    <div class="detail-label">Area by Permission Type</div>
                    <div style="margin-top: 10px; position: relative; height: 200px;">
                        <canvas id="bboxAreaChart"></canvas>
                    </div>
                    <div id="bbox-area-stats"></div>
                </div>
                
                <div id="legend" style="margin-top: 20px; display: none;">
                    <div class="detail-label">Legend</div>
                    <div style="margin-top: 10px;">
                        <div style="display: flex; align-items: center; margin-bottom: 8px;">
                            <div style="width: 20px; height: 20px; background: #4CAF50; margin-right: 10px; border: 1px solid #333;"></div>
                            <span>Yes</span>
                        </div>
                        <div style="display: flex; align-items: center; margin-bottom: 8px;">
                            <div style="width: 20px; height: 20px; background: #7570b3; margin-right: 10px; border: 1px solid #333;"></div>
                            <span>No</span>
                        </div>
                        <div style="display: flex; align-items: center; margin-bottom: 8px;">
                            <div style="width: 20px; height: 20px; background: #d95f02; margin-right: 10px; border: 1px solid #333;"></div>
                            <span>Maybe</span>
                        </div>
                    </div>
                </div>
                
                <div id="chart-container" style="margin-top: 20px; display: none;">
                    <div class="detail-label">Area by Permission Type</div>
                    <div style="margin-top: 10px; position: relative; height: 250px;">
                        <canvas id="areaChart"></canvas>
                    </div>
                    <div id="area-stats" style="margin-top: 10px;"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <script>
        let map;
        let zoningLayer;
        let zoneData = {};
        let zoneHeaders = [];
        let areaChart = null;
        let bboxChart = null;
        let drawnItems = null;
        let drawControl = null;
        let currentBBox = null;
        let isDrawing = false;

        // District filtering state
        let districts = [];
        let layerDistricts = new Map(); // layer -> district name
        let selectedDistricts = new Set(['All']);

        function initMap() {
            map = L.map('map').setView([37.6872, -97.3301], 11);
            
            L.tileLayer('https://tiles.stadiamaps.com/tiles/stamen_toner/{z}/{x}/{y}{r}.png?api_key=4f4c222f-cf1d-412d-a93a-e8bdaf1e4a3d', {
                maxZoom: 20,
                attribution: '&copy; <a href="https://stadiamaps.com/">Stadia Maps</a>, &copy; <a href="https://stamen.com/">Stamen Design</a>, &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            }).addTo(map);

            drawnItems = new L.FeatureGroup();
            map.addLayer(drawnItems);

            map.on(L.Draw.Event.CREATED, function(e) {
                drawnItems.clearLayers();
                drawnItems.addLayer(e.layer);
                currentBBox = e.layer.getBounds();
                isDrawing = false;

                e.layer.setStyle({
                    color: '#1a73e8',
                    weight: 2,
                    fillColor: '#1a73e8',
                    fillOpacity: 0.05,
                    dashArray: '6,4'
                });

                document.getElementById('draw-bbox-btn').textContent = '📦 Redraw Area';
                document.getElementById('draw-bbox-btn').classList.remove('active');
                document.getElementById('clear-bbox-btn').style.display = 'block';
                document.getElementById('bbox-hint').style.display = 'none';

                const selectedUse = document.getElementById('use-select').value;
                if (selectedUse) updateBBoxStats(selectedUse, currentBBox);
            });

            map.on(L.Draw.Event.DRAWSTART, function() { isDrawing = true; });

            map.on(L.Draw.Event.DRAWSTOP, function() {
                if (isDrawing) {
                    isDrawing = false;
                    document.getElementById('draw-bbox-btn').classList.remove('active');
                    document.getElementById('draw-bbox-btn').textContent = currentBBox ? '📦 Redraw Area' : '📦 Draw Area';
                    document.getElementById('bbox-hint').style.display = 'none';
                }
            });
        }

        function startDrawing() {
            const rectDrawer = new L.Draw.Rectangle(map, {
                shapeOptions: { color: '#1a73e8', weight: 2, fillOpacity: 0.05, dashArray: '6,4' },
                showArea: false
            });
            rectDrawer.enable();
            document.getElementById('draw-bbox-btn').classList.add('active');
            document.getElementById('draw-bbox-btn').textContent = '✕ Cancel Draw';
            document.getElementById('bbox-hint').style.display = 'block';
        }
        
        function calculateArea(geometry, properties) {
            return properties['Shape.STArea()'] || 0;
        }

        // ── District filtering ──────────────────────────────────────────

        function buildDistrictCheckboxes() {
            const names = [...new Set(districts.map(d => String(d.properties['COUNCIL'])))]
                .filter(Boolean)
                .sort((a, b) => Number(a) - Number(b));

            const container = document.getElementById('district-checkboxes');
            container.innerHTML = `
                <label class="district-check">
                    <input type="checkbox" value="All" checked onchange="handleDistrictChange(this)"> All
                </label>
                ${names.map(name => `
                <label class="district-check">
                    <input type="checkbox" value="${name}" onchange="handleDistrictChange(this)"> District ${name}
                </label>`).join('')}
            `;
        }

        function handleDistrictChange(checkbox) {
            if (checkbox.value === 'All') {
                selectedDistricts = new Set(['All']);
                document.querySelectorAll('#district-checkboxes input[type=checkbox]').forEach(cb => {
                    cb.checked = checkbox.checked;
                    if (cb.value !== 'All') selectedDistricts.add(cb.value);
                });
                if (!checkbox.checked) selectedDistricts = new Set();
            } else {
                selectedDistricts.delete('All');
                document.querySelector('#district-checkboxes input[value="All"]').checked = false;
                if (checkbox.checked) selectedDistricts.add(checkbox.value);
                else selectedDistricts.delete(checkbox.value);
            }
            applyDistrictFilter();
        }

        function applyDistrictFilter() {
            if (!zoningLayer) return;
            const isAll = selectedDistricts.has('All') || selectedDistricts.size === 0;

            zoningLayer.eachLayer(layer => {
                const district = layerDistricts.get(layer);
                const visible = isAll || selectedDistricts.has(district);
                if (visible) {
                    if (!map.hasLayer(layer)) map.addLayer(layer);
                } else {
                    if (map.hasLayer(layer)) map.removeLayer(layer);
                }
            });

            // Re-run chart for current land use with visible layers only
            const selectedUse = document.getElementById('use-select').value;
            if (selectedUse) updateMapForLandUse(selectedUse);
        }

        function loadDistricts() {
            const url = 'https://gismaps.wichita.gov/ageweb/rest/services/COWGIS/Districts/MapServer/3/query?where=1%3D1&outFields=COUNCIL&outSR=4326&returnGeometry=true&f=geojson';
            fetch(url)
                .then(r => r.json())
                .then(data => {
                    districts = data.features;

                    // Pre-compute district for each zoning layer
                    if (zoningLayer) {
                        zoningLayer.eachLayer(layer => {
                            const geometry = layer.feature.geometry;
                            let centroid;
                            if (geometry.type === 'Polygon') centroid = getCentroid(geometry.coordinates[0]);
                            else if (geometry.type === 'MultiPolygon') centroid = getCentroid(geometry.coordinates[0][0]);
                            else return;

                            for (const district of districts) {
                                if (districtContainsPoint(centroid, district.geometry)) {
                                    layerDistricts.set(layer, String(district.properties['COUNCIL']));
                                    break;
                                }
                            }
                        });
                    }

                    buildDistrictCheckboxes();
                })
                .catch(() => {
                    document.getElementById('district-checkboxes').innerHTML = 'Could not load districts';
                });
        }

        function districtContainsPoint(centroid, geometry) {
            const rings = geometry.type === 'Polygon'
                ? [geometry.coordinates[0]]
                : geometry.coordinates.map(r => r[0]);
            for (const ring of rings) {
                if (pointInPolygon(centroid, ring)) return true;
            }
            return false;
        }

        // ── Zoning data loading ─────────────────────────────────────────
        
        async function loadZoningData() {
            try {
                document.querySelector('#sidebar-header p').textContent = 'Loading city boundary...';
                
                const cityUrl = 'https://gismaps.wichita.gov/ageweb/rest/services/COWGIS/Districts/MapServer/2/query?where=CITY%3D%27WICHITA%27&outFields=*&outSR=4326&f=geojson';
                const cityResponse = await fetch(cityUrl);
                const cityData = await cityResponse.json();
                
                if (!cityData.features || cityData.features.length === 0)
                    throw new Error('Could not load Wichita city boundary');
                
                const wichitaBoundary = cityData.features[0].geometry;
                
                let allFeatures = [];
                let offset = 0;
                const limit = 1000;
                let hasMore = true;
                
                document.querySelector('#sidebar-header p').textContent = 'Loading zoning data...';
                
                while (hasMore) {
                    const url = `https://gismaps.wichita.gov/ageweb/rest/services/COWGIS/Plan_Zoning/MapServer/7/query?where=1%3D1&outFields=*&outSR=4326&f=geojson&resultOffset=${offset}&resultRecordCount=${limit}`;
                    const response = await fetch(url);
                    const data = await response.json();
                    
                    if (data.features && data.features.length > 0) {
                        const filteredFeatures = data.features.filter(feature =>
                            isWithinBoundary(feature.geometry, wichitaBoundary)
                        );
                        allFeatures = allFeatures.concat(filteredFeatures);
                        offset += data.features.length;
                        document.querySelector('#sidebar-header p').textContent = `Please wait. Loading... ${allFeatures.length} parcels in Wichita`;
                        if (data.features.length < limit) hasMore = false;
                    } else {
                        hasMore = false;
                    }
                }
                
                const geojson = { type: 'FeatureCollection', features: allFeatures };
                
                zoningLayer = L.geoJSON(geojson, {
                    style: { fillColor: '#666', fillOpacity: 0.4, color: '#999', weight: 1 },
                    onEachFeature: (feature, layer) => {
                        const zone = feature.properties.ZONING;
                        feature.properties.calculatedArea = calculateArea(feature.geometry, feature.properties);
                        layer.on('click', function() {
                            layer.bindPopup(`<strong>Zoning:</strong> ${zone}`).openPopup();
                        });
                    }
                }).addTo(map);
                
                map.fitBounds(zoningLayer.getBounds());
                document.querySelector('#sidebar-header p').textContent = `${allFeatures.length} zones loaded`;

                // Load districts now that zoning is ready
                loadDistricts();

            } catch (error) {
                console.error('Error loading zoning data:', error);
                document.querySelector('#sidebar-header p').textContent = 'Error loading map';
            }
        }
        
        function isWithinBoundary(geometry, boundary) {
            let testPoint;
            if (geometry.type === 'Polygon') testPoint = getCentroid(geometry.coordinates[0]);
            else if (geometry.type === 'MultiPolygon') testPoint = getCentroid(geometry.coordinates[0][0]);
            else return false;
            
            if (boundary.type === 'Polygon') return pointInPolygon(testPoint, boundary.coordinates[0]);
            else if (boundary.type === 'MultiPolygon') return boundary.coordinates.some(poly => pointInPolygon(testPoint, poly[0]));
            return false;
        }
        
        function getCentroid(ring) {
            let x = 0, y = 0;
            for (const coord of ring) { x += coord[0]; y += coord[1]; }
            return [x / ring.length, y / ring.length];
        }
        
        function pointInPolygon(point, polygon) {
            const x = point[0], y = point[1];
            let inside = false;
            for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
                const xi = polygon[i][0], yi = polygon[i][1];
                const xj = polygon[j][0], yj = polygon[j][1];
                const intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }

        function layerInBBox(layer, bounds) {
            const geometry = layer.feature.geometry;
            let centroid;
            if (geometry.type === 'Polygon') centroid = getCentroid(geometry.coordinates[0]);
            else if (geometry.type === 'MultiPolygon') centroid = getCentroid(geometry.coordinates[0][0]);
            else return false;
            return bounds.contains(L.latLng(centroid[1], centroid[0]));
        }
        
        async function loadCSV() {
            try {
                const response = await fetch('Zoning Use Regulations.csv');
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const text = await response.text();
                if (text.trim().startsWith('<!DOCTYPE') || text.trim().startsWith('<html')) {
                    alert('Error: CSV file not found.');
                    return;
                }
                
                const lines = text.trim().split('\n');
                const headerParts = lines[0].split(',');
                zoneHeaders = headerParts.slice(1).map(h => h.trim());
                
                const select = document.getElementById('use-select');
                
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i];
                    let useName = '', values = [];
                    
                    if (line.startsWith('"')) {
                        const closingQuoteIndex = line.indexOf('"', 1);
                        useName = line.substring(1, closingQuoteIndex);
                        values = line.substring(closingQuoteIndex + 2).split(',').map(v => v.trim());
                    } else {
                        const parts = line.split(',');
                        useName = parts[0].trim();
                        values = parts.slice(1).map(v => v.trim());
                    }
                    
                    if (useName) {
                        zoneData[useName] = {};
                        for (let j = 0; j < zoneHeaders.length; j++) {
                            zoneData[useName][zoneHeaders[j]] = values[j] || 'N';
                        }
                        const option = document.createElement('option');
                        option.value = useName;
                        option.textContent = useName;
                        select.appendChild(option);
                    }
                }
            } catch (error) {
                console.error('Error loading CSV:', error);
                alert('Error loading CSV file: ' + error.message);
            }
        }
        
        function updateMapForLandUse(landUse) {
            const legend = document.getElementById('legend');
            const chartContainer = document.getElementById('chart-container');
            const isAll = selectedDistricts.has('All') || selectedDistricts.size === 0;
            
            if (!landUse || !zoneData[landUse]) {
                zoningLayer.eachLayer(layer => {
                    layer.setStyle({ fillColor: '#666', fillOpacity: 0.4, color: '#999', weight: 1 });
                });
                legend.style.display = 'none';
                chartContainer.style.display = 'none';
                document.getElementById('bbox-stats-container').style.display = 'none';
                return;
            }
            
            legend.style.display = 'block';
            chartContainer.style.display = 'block';
            
            const colors = { 'P': '#4CAF50', 'C': '#d95f02', 'N': '#7570b3' };
            const useData = zoneData[landUse];
            const areaTotals = { 'P': 0, 'C': 0, 'N': 0 };
            
            zoningLayer.eachLayer(layer => {
                const zoning = layer.feature.properties.ZONING;
                let permission = useData[zoning] || 'N';
                const area = layer.feature.properties.calculatedArea || 0;
                if (permission === 'C/P') permission = 'C';

                // Only count visible (district-filtered) layers in stats
                const visible = isAll || selectedDistricts.has(layerDistricts.get(layer));
                if (visible) areaTotals[permission] = (areaTotals[permission] || 0) + area;
                
                layer.setStyle({
                    fillColor: colors[permission] || colors['N'],
                    fillOpacity: 0.6,
                    color: '#333',
                    weight: 1
                });
                
                const displayPermission = useData[zoning] || 'N';
                layer.bindPopup(`<strong>Zoning:</strong> ${zoning}<br><strong>${landUse}:</strong> ${displayPermission}`);
            });
            
            updateAreaChart(areaTotals);

            if (currentBBox) updateBBoxStats(landUse, currentBBox);
        }

        function updateBBoxStats(landUse, bounds) {
            if (!zoningLayer || !landUse || !zoneData[landUse]) return;

            const useData = zoneData[landUse];
            const areaTotals = { 'P': 0, 'C': 0, 'N': 0 };
            let featureCount = 0;
            const isAll = selectedDistricts.has('All') || selectedDistricts.size === 0;

            zoningLayer.eachLayer(layer => {
                if (!layerInBBox(layer, bounds)) return;
                // Respect district filter in bbox too
                const visible = isAll || selectedDistricts.has(layerDistricts.get(layer));
                if (!visible) return;

                const zoning = layer.feature.properties.ZONING;
                let permission = useData[zoning] || 'N';
                const area = layer.feature.properties.calculatedArea || 0;
                if (permission === 'C/P') permission = 'C';
                areaTotals[permission] = (areaTotals[permission] || 0) + area;
                featureCount++;
            });

            document.getElementById('bbox-stats-container').style.display = 'block';
            updateBBoxChart(areaTotals, featureCount);
        }

        function updateBBoxChart(areaTotals, featureCount) {
            const ctx = document.getElementById('bboxAreaChart').getContext('2d');
            const sqFeetToSqMiles = 1 / 27878400;
            const totalArea = Object.values(areaTotals).reduce((sum, val) => sum + val, 0);

            if (bboxChart) bboxChart.destroy();

            bboxChart = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: ['Yes (P)', 'Maybe (C)', 'No (N)'],
                    datasets: [{
                        data: [areaTotals['P'], areaTotals['C'], areaTotals['N']],
                        backgroundColor: ['#4CAF50', '#d95f02', '#7570b3'],
                        borderColor: '#fff',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: { legend: { display: false }, tooltip: { enabled: false } },
                    events: []
                }
            });

            const totalSqMiles = (totalArea * sqFeetToSqMiles).toFixed(3);
            document.getElementById('bbox-area-stats').innerHTML = `
                <strong>${featureCount} parcels</strong> | <strong>${totalSqMiles} mi²</strong><br>
                <div class="bbox-stat-row"><div class="bbox-stat-dot" style="background:#4CAF50"></div>
                    Yes: ${((areaTotals['P'] / totalArea) * 100 || 0).toFixed(1)}% (${(areaTotals['P'] * sqFeetToSqMiles).toFixed(3)} mi²)
                </div>
                <div class="bbox-stat-row"><div class="bbox-stat-dot" style="background:#7570b3"></div>
                    No: ${((areaTotals['N'] / totalArea) * 100 || 0).toFixed(1)}% (${(areaTotals['N'] * sqFeetToSqMiles).toFixed(3)} mi²)
                </div>
                <div class="bbox-stat-row"><div class="bbox-stat-dot" style="background:#d95f02"></div>
                    Maybe: ${((areaTotals['C'] / totalArea) * 100 || 0).toFixed(1)}% (${(areaTotals['C'] * sqFeetToSqMiles).toFixed(3)} mi²)
                </div>
            `;
        }
        
        function updateAreaChart(areaTotals) {
            const ctx = document.getElementById('areaChart').getContext('2d');
            const sqFeetToSqMiles = 1 / 27878400;
            const totalArea = Object.values(areaTotals).reduce((sum, val) => sum + val, 0);
            
            if (areaChart) areaChart.destroy();
            
            areaChart = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: ['Permitted (P)', 'Conditional (C/C/P)', 'Not Permitted (N)'],
                    datasets: [{
                        data: [areaTotals['P'], areaTotals['C'], areaTotals['N']],
                        backgroundColor: ['#4CAF50', '#d95f02', '#7570b3'],
                        borderColor: '#fff',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: { legend: { display: false }, tooltip: { enabled: false } },
                    events: []
                }
            });
            
            const totalSqMiles = (totalArea * sqFeetToSqMiles).toFixed(2);
            document.getElementById('area-stats').innerHTML = `
                <strong>Total Area:</strong> ${totalSqMiles} square miles<br>
                <strong>Yes:</strong> ${((areaTotals['P'] / totalArea) * 100).toFixed(1)}% (${(areaTotals['P'] * sqFeetToSqMiles).toFixed(2)} mi²)<br>
                <strong>No:</strong> ${((areaTotals['N'] / totalArea) * 100).toFixed(1)}% (${(areaTotals['N'] * sqFeetToSqMiles).toFixed(2)} mi²)<br>
                <strong>Maybe:</strong> ${((areaTotals['C'] / totalArea) * 100).toFixed(1)}% (${(areaTotals['C'] * sqFeetToSqMiles).toFixed(2)} mi²)<br>
            `;
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            initMap();
            loadCSV();
            loadZoningData();
            
            document.getElementById('use-select').addEventListener('change', (e) => {
                updateMapForLandUse(e.target.value);
            });

            document.getElementById('draw-bbox-btn').addEventListener('click', () => {
                startDrawing();
            });

            document.getElementById('clear-bbox-btn').addEventListener('click', () => {
                drawnItems.clearLayers();
                currentBBox = null;
                document.getElementById('clear-bbox-btn').style.display = 'none';
                document.getElementById('draw-bbox-btn').textContent = '📦 Draw Area';
                document.getElementById('draw-bbox-btn').classList.remove('active');
                document.getElementById('bbox-hint').style.display = 'none';
                document.getElementById('bbox-stats-container').style.display = 'none';
                if (bboxChart) { bboxChart.destroy(); bboxChart = null; }
            });
        });
    </script>
</body>
</html>
